<?xml version="1.0" encoding="UTF-8"?>
<svg id="png-toggle-widget" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 161">
  <image id="imgOff" href="data:image/jpeg;base64," x="12" y="12" width="111" height="95" preserveAspectRatio="xMidYMid meet" opacity="0"/>
  <image id="imgOn" href="data:image/jpeg;base64," x="12" y="12" width="111" height="95" preserveAspectRatio="xMidYMid meet" opacity="1"/>
  <text id="label" x="67.5" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f3f7fb">START</text>
  <rect id="clickTarget" x="0" y="0" width="135" height="161" fill="#ffffff" fill-opacity="0.001" pointer-events="all"/>

  <script><![CDATA[
    //!export-start
    let _pb_state = true;
    let _pb_cmd = true;
    let _ps_label = 'START';
    //!export-end

    let currentState = !!_pb_state;

    function setText(el, text) {
      if (!el) return;
      while (el.firstChild) {
        el.removeChild(el.firstChild);
      }
      el.appendChild(document.createTextNode(text));
    }

    function render() {
      const offEl = document.getElementById('imgOff');
      const onEl = document.getElementById('imgOn');
      const labelEl = document.getElementById('label');

      if (offEl) offEl.setAttribute('opacity', currentState ? '0' : '1');
      if (onEl) onEl.setAttribute('opacity', currentState ? '1' : '0');
      setText(labelEl, _ps_label || '');
    }

    function putValue(id, value) {
      if (id === '_pb_state') {
        currentState = !!value;
        render();
      } else if (id === '_ps_label') {
        _ps_label = String(value ?? '');
        render();
      }
    }

    function sendCommand(nextState) {
      if (typeof postValue === 'function') {
        postValue('_pb_cmd', nextState);
      }
    }

    const clickTarget = document.getElementById('clickTarget');
    if (clickTarget) {
      clickTarget.addEventListener('mousedown', () => sendCommand(true));
      clickTarget.addEventListener('mouseup', () => sendCommand(false));
      clickTarget.addEventListener('mouseleave', () => sendCommand(false));
      clickTarget.addEventListener('touchstart', () => sendCommand(true));
      clickTarget.addEventListener('touchend', () => sendCommand(false));
      clickTarget.style.cursor = 'pointer';
    }

    render();
  ]]></script>
</svg>
